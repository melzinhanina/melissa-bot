name: Compatibility checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Test runtime architecture profiles
        run: node --test tests/runtimeProfile.test.js
      - name: Verify optional Sharp loading does not crash
        run: node --input-type=module -e "import('./src/services/sharpSticker.js').then(m => console.log('sharpSticker module loaded:', typeof m.trySharpSticker === 'function'))"
